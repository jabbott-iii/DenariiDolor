# Keeps GitHub Actions and Rust crates patched; each update runs through ci.yml and security.yml.
# The pub ecosystem (Dart packages) joins in M1.3, and Gradle for android/ when it has dependencies of its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
