name: CD

# Triggered by `make release VERSION=vX.Y.Z` (pushes an annotated tag).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # no later step pushes with git; keeps GITHUB_TOKEN out of .git/config

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vMAJOR.MINOR.PATCH[-prerelease] with parts 0-999"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY" ]]; then echo "::error::ANDROID_SIGNING_KEY secret is not set"; exit 1; fi
          echo "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signatures and collect artifacts
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "::error::Signed APK not found (was the release signing config applied?)"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB" | tee /dev/stderr | grep -q "jar verified"
          mkdir -p dist
          NAME="DenariiDolor-${{ steps.version.outputs.name }}"
          cp "$APK" "dist/$NAME.apk"
          cp "$AAB" "dist/$NAME.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      # Kept private (not attached to the public release): the R8 mapping would ease reverse engineering.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
