name: CD

# Triggered by `make release VERSION=vX.Y.Z` (pushes an annotated tag).
# Three jobs keep secrets and write access apart (CS-19):
#   ci-gate  - requires a green CI run for the tagged commit; reads Actions only.
#   build    - the only job that sees signing secrets; read-only token.
#   publish  - the only job that can write; no secrets, no Gradle.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Require green CI
    runs-on: ubuntu-24.04
    # `make release` only requires main to be pushed, so CI for the tagged commit may still be running; wait for it.
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Check CI result for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while :; do
            RUNS=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | {id, status, conclusion, event}]')
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$RUNS" >/dev/null; then
              echo "CI passed for $SHA: $(jq -c '[.[] | select(.conclusion == "success") | .id]' <<<"$RUNS")"
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<<"$RUNS" >/dev/null; then
              echo "CI still running for $SHA; waiting..."
              sleep 60
              continue
            fi
            echo "::error::No successful CI (ci.yml) run for $SHA. Runs: $RUNS"
            exit 1
          done

  build:
    name: Signed Android build
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step pushes with git; keeps GITHUB_TOKEN out of .git/config

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vMAJOR.MINOR.PATCH[-prerelease] with parts 0-999"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Restore signing keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY" ]]; then echo "::error::ANDROID_SIGNING_KEY secret is not set"; exit 1; fi
          echo "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # --no-daemon: no Gradle process outlives this step holding the signing passwords.
      - name: Build signed AAB and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signatures and collect artifacts
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "::error::Signed APK not found (was the release signing config applied?)"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB" | tee /dev/stderr | grep -q "jar verified"
          mkdir -p dist
          NAME="DenariiDolor-${{ steps.version.outputs.name }}"
          cp "$APK" "dist/$NAME.apk"
          cp "$AAB" "dist/$NAME.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Kept private (not attached to the public release): the R8 mapping would ease reverse engineering.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ needs.build.outputs.name }}
          path: dist

      - name: Check release files
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          fail_on_unmatched_files: true
