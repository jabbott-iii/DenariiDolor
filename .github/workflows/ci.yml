name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style, static analysis, Android lint, unit tests + coverage, and a minified (R8) release build.
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Kotlin style (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Coverage report (JaCoCo)
        run: ./gradlew createDebugUnitTestCoverageReport

      # Proves the release variant compiles and survives R8 shrinking (unsigned here; CD signs).
      - name: Release build
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  # Room/SQLCipher, migrations, Compose UI and PDF rendering need a real device runtime.
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 26, 35 ] # minSdk and targetSdk
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results-api-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/
          retention-days: 14
