name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Lint Check
      run: ./gradlew lint --no-daemon --scan

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Generate Test Report
      if: always()
      run: ./gradlew testDebugUnitTestCoverage --no-daemon || true

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/build/test-results/**'
        retention-days: 30

    - name: Upload Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: '**/build/reports/coverage/**'
        retention-days: 30

    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Unit Test Results
        path: '**/build/test-results/testDebugUnitTest/**.xml'
        reporter: 'java-junit'
        fail-on-error: false

    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: ./gradlew sonarqube --no-daemon
      continue-on-error: true

    - name: Comment PR with Build Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Build and Tests Completed\n\n- ✓ Lint Check Passed\n- ✓ Debug APK Built\n- ✓ Unit Tests Passed\n- ✓ Coverage Report Generated'
          })
      continue-on-error: true

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Run Connected Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: ./gradlew connectedAndroidTest --no-daemon

    - name: Upload Instrumented Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-results
        path: '**/build/outputs/androidTest-results/**'
        retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Detekt Analysis
      run: ./gradlew detekt --no-daemon || true
      continue-on-error: true

    - name: Ktlint Check
      run: ./gradlew ktlintCheck --no-daemon || true
      continue-on-error: true

    - name: Upload Analysis Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: '**/build/reports/**'
        retention-days: 30

  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Check Dependencies for Vulnerabilities
      run: ./gradlew dependencyCheckAnalyze --no-daemon || true
      continue-on-error: true

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: '**/build/reports/dependency-check/**'
        retention-days: 30
