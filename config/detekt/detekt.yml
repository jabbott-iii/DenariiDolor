# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Compose conventions: PascalCase @Composable functions, many parameters, long layout functions.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    excludes: ['**/test/**', '**/androidTest/**']
    # Count the public surface only; private helpers and interface overrides don't make a class harder to use.
    ignorePrivate: true
    ignoreOverridden: true
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**']
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 4
    # Validation functions use early-return guard clauses by design.
    excludeGuardClauses: true
  ForbiddenComment:
    active: false
