[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
composeBom = "2026.09.00"
activity = "1.13.0"
appcompat = "1.8.0"
biometric = "1.1.0"
coreKtx = "1.19.1"
coroutines = "1.11.0"
# Kept equal in the app and the instrumented tests; see app/build.gradle.kts.
kotlinxSerialization = "1.8.1"
hilt = "2.60.1"
hiltNavigationCompose = "1.2.0"
lifecycle = "2.11.0"
material = "1.12.0"
navigation = "2.10.2"
room = "2.8.5"
securityCrypto = "1.1.0-alpha06"
sqlcipher = "4.19.1"
sqlite = "2.7.1"
vico = "2.0.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
uiautomator = "2.3.0"
ktlintGradle = "14.2.0"
ktlint = "1.3.1"
detekt = "1.23.8"
# Build tooling only (CS-22, CS-23): patched versions raised onto AGP's and ktlint's classpaths; nothing here ships in the app.
# Remove each one once the dependency graph shows AGP or ktlint brings a patched version itself.
buildProtobuf = "3.25.9"
buildCommonsIo = "2.22.0"
buildLogback = "1.5.38"
# One version for all three Bouncy Castle modules: bcpkix and bcutil must match bcprov.
buildBouncyCastle = "1.86"
buildCommonsCompress = "1.28.0"
buildJdom2 = "2.0.6.1"
buildJose4j = "0.9.6"
# CS-25: raised wherever lint or AGP's test-engine worker asks for older ones (rule in app/build.gradle.kts).
buildCommonsLang3 = "3.18.0"
buildHttpClient = "4.5.14"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto-ktx", version.ref = "securityCrypto" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
vico-core = { group = "com.patrykandpatrick.vico", name = "core", version.ref = "vico" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
build-protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "buildProtobuf" }
build-commons-io = { group = "commons-io", name = "commons-io", version.ref = "buildCommonsIo" }
build-logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "buildLogback" }
build-logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "buildLogback" }
build-bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "buildBouncyCastle" }
build-bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "buildBouncyCastle" }
build-bouncycastle-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "buildBouncyCastle" }
build-commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "buildCommonsCompress" }
build-jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "buildJdom2" }
build-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "buildJose4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
