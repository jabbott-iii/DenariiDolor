include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # No hand-written Dart lives here. On a Mac, ios/ also holds symbolic links to plugin sources.
  # lib/platform/rust/ is generated by flutter_rust_bridge_codegen, and lib/l10n/app_localizations*.dart
  # by flutter gen-l10n; neither is ever edited by hand (ADR-0012).
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/platform/rust/**
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    - unawaited_futures
