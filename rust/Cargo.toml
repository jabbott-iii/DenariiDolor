# The Rust workspace of Denarii Dolor. Its crates and their layers are in docs/01-architecture.md.

[workspace]
resolver = "3"
members = ["crates/bridge", "crates/core", "crates/keystore", "crates/report", "crates/store", "crates/vault"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Each third-party crate is approved in the register in docs/02-dependency-policy.md.
[workspace.dependencies]
denarii-core = { path = "crates/core" }
denarii-keystore = { path = "crates/keystore" }
# Pinned exactly, with its Dart package, its codegen, and flutter_rust_bridge_hooks (ADR-0014). The
# default features would bring logging crates. `thread-pool` runs each call off Flutter's UI thread,
# and the generated code doesn't compile without `dart-opaque` and `rust-async`.
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = ["dart-opaque", "rust-async", "thread-pool"] }
# Pinned exactly, because an upgrade changes the SQLCipher build that opens users' files (ADR-0017). The one feature
# compiles SQLCipher and OpenSSL's libcrypto from source on every target; the default features would add a statement
# cache and a WebAssembly backend that nothing uses.
# Pinned exactly, because the keystore crate's `unsafe` code relies on these declarations of `jni.h` (ADR-0022); an
# upgrade is reviewed with the dependency-upgrade skill. Used on Android only.
jni-sys = "=0.4.1"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
# The vault's cryptography, from RustCrypto and the `rust-random` project (ADR-0023). Each is pinned exactly, because an
# upgrade could change the bytes that open users' profiles: v1's known answers and golden profile in crates/vault must
# pass unchanged after every upgrade. `zeroize` also wipes AES-GCM's key schedules and SHA-256's state on drop.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }
# NFKC for security answers, pinned exactly because a new Unicode version could change how an answer normalizes
# (ADR-0023).
unicode-normalization = { version = "=0.1.26", default-features = false }
# The vault profile's JSON, read and written through `Value`, with no derive macros (ADR-0023).
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

# crates/bridge/Cargo.toml and crates/keystore/Cargo.toml repeat these lints, with `unsafe_code` at `deny` (ADR-0014,
# ADR-0022). Change all three.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Money and input handling: no silent wrapping, truncating casts, or panics on data.
arithmetic_side_effects = "warn"
as_conversions = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Nothing in shipped code prints or logs (CLAUDE.md, "Security posture").
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

# Overflow is checked in every build, release included. The code uses checked arithmetic wherever
# overflow is possible; this catches any place that was missed instead of letting a balance wrap.
[profile.release]
overflow-checks = true
