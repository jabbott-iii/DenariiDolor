name: denarii_dolor
description: "Denarii Dolor, an offline personal-finance ledger."
publish_to: "none"

# A placeholder for development builds. M6.1 sets the release version, with a build number
# (after the +) above every versionCode v1 uploaded to Google Play.
version: 0.0.0+1

# Flutter is pinned exactly, so `flutter pub get` fails on any other release (ADR-0009).
environment:
  sdk: ^3.14.0
  flutter: 3.50.1

# Each package is approved in the register in docs/02-dependency-policy.md.
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  # The bridge's Dart runtime and its native-assets build hook, pinned exactly with the Rust crate and
  # the codegen (ADR-0014).
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  # The localizations that `flutter gen-l10n` writes from lib/l10n/ import these two. Both already
  # came with material_ui (M1.4).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs integration_test/ on an emulator or a device.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Runs `flutter gen-l10n` with l10n.yaml on `flutter pub get` and in every build.
  generate: true
